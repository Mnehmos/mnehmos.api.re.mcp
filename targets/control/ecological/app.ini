APP_NAME = apire Ecological Control
RUN_MODE = prod

[server]
HTTP_PORT = 3001
ROOT_URL = http://127.0.0.1:3001/
DISABLE_SSH = true
START_SSH_SERVER = false

[database]
DB_TYPE = sqlite3
PATH = data/gitea.db

[security]
INSTALL_LOCK = true

[service]
DISABLE_REGISTRATION = true

[repository]
ROOT = repos

[log]
MODE = console
LEVEL = warn
